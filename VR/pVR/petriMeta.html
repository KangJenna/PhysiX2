<!DOCTYPE html>
<html>
  <head>
    <title>Room VR Petrisagge </title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
    <script src="petriMeta.js"></script>
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
  </head>

  <body>
    <a-scene webxr="optionalFeatures: hit-test; referenceSpaceType: local-floor">
      <a-assets>
        <a-asset-item id="asset-room" src="../../models/room09-optimizado.glb"></a-asset-item> 
      </a-assets>

      <a-entity id="gltf-model" gltf-model="#asset-room" position="0 -0.7 -2.5" scale="1 1 1"></a-entity>
      <a-sky color="#1C607A"></a-sky> 
      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="-1 2 1"></a-entity>

      <a-entity id="rig" position="1.8 0 -0.2" movement-controls="speed: 0.15; fly: false; constrainToNavMesh: false">
        <a-entity camera look-controls position="0 1.6 0"></a-entity>
          <a-entity id="leftHand" 
                          hand-controls="hand: left; handModelStyle: highPoly; color: #ffcccc"
                          laser-controls="hand: left"
                          raycaster="objects: .massage-zone, .raycastable; far: 10; showLine: true; lineColor: #5BEEF7; lineOpacity: 0.6;interval: 50"
                          vr-hand-massage="hand: left; minDist: 0.08; maxDist: 0.30; hapticIntensity: 0.4"
                          recalibrar-altura>
          </a-entity>
            
          <a-entity id="rightHand" 
                        hand-controls="hand: right; handModelStyle: highPoly; color: #ffcccc"
                        laser-controls="hand: right"
                        raycaster="objects: .massage-zone, .raycastable; far: 10; showLine: true; lineColor: #5BEEF7; lineOpacity: 0.6; interval: 50"
                        vr-hand-massage="hand: right; minDist: 0.12; maxDist: 0.22; hapticIntensity: 0.7"
                        recalibrar-altura>
          </a-entity>
      </a-entity>

                
      <a-torus class="massage-zone" data-step="1" position="2.67 0.85 -0.29" rotation="90 -90 0" scale ="0.2 0.2 0.2" radius="0.3" radius-tubular="0.05" arc="180" material="color: purple; opacity: 0.5">
      </a-torus>
      <a-torus class="massage-zone" data-step="2" position="2.8 0.89 -0.27" rotation="90 90 0" scale ="0.22 0.2 0.2" radius="0.3" radius-tubular="0.05" arc="180" material="color: purple; opacity: 0.5">
      </a-torus>
      <a-box class="massage-zone" data-step="3" position="2.735 0.9 -0.27" rotation="0 0 0" scale="0.01 0.01 0.5" material="transparent:true; opacity: 0.3"></a-box>

      <a-entity id="infoPanel2" position="1.8 1.6 -1.0">
          <a-plane width="1.5" height="1" color="#1a1a1a" opacity="0.5" position="1 0 -1" rotation="0 0 0"></a-plane>    
          <a-text value="TECNICA PETRISAGGE" color="#5BEEF7" align="center" position="1 0.4 -1" width="2" rotation="0 0 0"></a-text>       
          <a-text id="instrucciones-guia" 
                  value="Wringing\n
                        PASO 1:Inicia en la zona de Gastronemios (en la parte media del arco purpura)\n
                        PASO 2:Desliza las esferas con ayuda del mouse arrriba-abajo en la zona indicada\n
                        Realiza 10 repeticiones para concluir con el masaje" 
                  color="white" 
                  align="center" 
                  position="1 -0.04 -1" 
                  rotation="0 0 0"
                  width="1.5"
                  wrap-count="40">
          </a-text>
      </a-entity>

      <a-entity id="infoPanel3" width="2" height=".3" color="#1a1a1a" opacity="0.7" >
        <a-plane id="main-panel" width="3" height=".5" color="#1a1a1a" opacity="0.9"position="2.5 0.5 -3" rotation="0 0 0">
          <a-text id="count-panel"
                  position="0 0 0" 
                  align="center"
                  width="3"
                  >
          </a-text>
        </a-plane>
      </a-entity>


      <a-entity id="infoPanel4" teoria-carrusel >
        <a-plane width="1.5" height="1" color="#1a1a1a" opacity="0.5" rotation="0 -90 0" position="7.3 2.3 -3.5" scale="2 2 3"></a-plane>    
                d
          <a-entity id="titulo"
            troika-text="value:Teoría Técnica Petrisagge ;
                        color: cyan;
                        align: center;
                        maxWidth: 2.5;
                        fontSize: 0.15;
                        anchor: center;
                        baseline: middle"
            position="7.2 3 -3.4"
            rotation="0 -90 0">
          </a-entity>
                
          <a-entity id="teoria"
            troika-text=
                        "color: white;
                        align: justify;
                        maxWidth: 2;
                        fontSize: 0.1;
                        anchor: center;
                        baseline: middle"
              position="7.2 2.5 -3.4"
              rotation="0 -90 0">                           
          </a-entity>

          <a-entity id="flecha-izq" 
            class="raycastable"
            geometry="primitive: triangle; "
            material="color: #5BEEF7; side: double"
            position="7.2 1.5 -4"
            rotation="180 -45 90"
            scale="0.1 0.1 0.1">
          </a-entity>


          <a-entity id="flecha-der" 
            class="raycastable"
            geometry="primitive: triangle;"
            material="color: #5BEEF7; side: double"
            position="7.2 1.5 -2.7"
            rotation="180 -90 -90"
            scale="0.1 0.1 0.1">
          </a-entity>

          <a-entity id="pagina-indicador"
            troika-text="value: 1 / 5;
                        color: #5BEEF7;
                        fontSize: 0.1;
                        anchorX: center;
                        anchorY: middle"
            position="7.2 1.5 -3.4"
            rotation ="0 -90 0" >
          </a-entity>
      </a-entity>
      
      <a-plane id="botonSalir3D" 
        position="-2.2 1.5 0" 
        rotation="0 90 0"
        width="0.5" height="0.2" 
        color="#1a1a1a" 
        class="raycastable"
        enlace-menu
        >
          <a-text value="Salir" align="center" width="2" color="#5BEEF7"></a-text>
      </a-plane>

      <a-plane id="botonReiniciar" 
                position="-2.2 1.2 0" rotation="0 90 0"
                width="0.5" height="0.2" 
                color="#1a1a1a" 
                class="raycastable"
                reiniciar-masaje>
                <a-text value="Reiniciar" align="center" width="2" color="#5BEEF7"></a-text>
      </a-plane>

    </a-scene>
  </body>
</html>
