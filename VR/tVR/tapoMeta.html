<!DOCTYPE html>
<html>
  <head>
    <title>Room VR Pression</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="tapoMeta.js"></script>
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-extras@7.2.0/dist/aframe-extras.min.js"></script>
  </head>

  <body>
    <a-scene webxr="optionalFeatures: hit-test; referenceSpaceType: local-floor">
      <a-assets>
        <a-asset-item id="asset-room" src="../../models/room09.glb"></a-asset-item> 
      </a-assets>

      <a-entity id="gltf-model" gltf-model="#asset-room" position="0 -0.7 -2.5" scale="1 1 1"></a-entity>
      <a-sky color="#1C607A"></a-sky> 
      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="-1 2 1"></a-entity>


      <a-entity id="rig" position="1.8 0 -0.2" movement-controls="speed: 0.15; fly: false; constrainToNavMesh: false"> 
        <a-entity camera look-controls  position="0 1.6 0"></a-entity>
          <a-entity id="leftHand" 
                          hand-controls="hand: left; handModelStyle: highPoly; color: #ffcccc"
                          laser-controls="hand: left"
                          raycaster="objects: .massage-zone, .raycastable; far: 10; showLine: true; lineColor: #5BEEF7; lineOpacity: 0.6;interval: 50"
                          vr-hand-massage="hand: left; minDist: 0.08; maxDist: 0.30; hapticIntensity: 0.4"
                          recalibrar-altura>
          </a-entity>

          <a-entity id="rightHand" 
                        hand-controls="hand: right; handModelStyle: highPoly; color: #ffcccc"
                        laser-controls="hand: right"
                        raycaster="objects: .massage-zone, .raycastable; far: 10; showLine: true; lineColor: #5BEEF7; lineOpacity: 0.6; interval: 50"
                        vr-hand-massage="hand: right; minDist: 0.12; maxDist: 0.22; hapticIntensity: 0.7"
                        recalibrar-altura>
          </a-entity>

        </a-entity>

        
      </a-entity>

      <a-entity id="infoPanel2" position="1.8 1.6 -1.0">
        <a-plane width="1.5" height="1" color="#1a1a1a" opacity="0.5" position="-2 0 0" rotation="0 90 0"></a-plane>    
          <a-text value="Tecnica Pression" color="#5BEEF7" align="center" position="-2 0.4 0" width="2" rotation="0 90 0"></a-text>    
          <a-text id="instrucciones-guia" 
            value="Oprimiendo ambos gatillos de los controles y colocando el pulgar dentro del aro, tus manos se cerraran para realizar la tecnica.\n\nPASO 1:Inicia en la zona de Gastronemios deslizando las manos cerradas\n
                  Realiza 10 repeticiones para concluir con el masaje." 
            color="white" 
            align="center" 
            position="-2 0 0" 
            rotation="0 90 0"
            width="1.5"
            wrap-count="50"> 
          </a-text>
      </a-entity>

      <a-entity id="infoPanel3" width="2" height=".3" color="#1a1a1a" opacity="0.5" position="-2 0 -1.7" rotation="0 90 0">
        <a-plane id="main-panel" width="2.5" height=".4" color="#1a1a1a" opacity="0.7">
        <a-text id="count-panel" 
          position="0 0 0.01" 
          align="center"
          width="2"
          value="Iniciando repeticiones...">
        </a-text>
      </a-entity>


      <a-entity id="infoPanel4" teoria-carrusel >
        <a-plane width="1.5" height="1" color="#1a1a1a" opacity="0.5" rotation="0 0 0" position="5 2 -4" scale="2 2 3"></a-plane>    
        <a-entity id="titulo"
          troika-text="value:Teoría Técnica Pression ;
                      color: cyan;
                      align: center;
                      maxWidth: 2.5;
                      fontSize: 0.15;
                      anchor: center;
                      baseline: middle"
          position="5 2.8 -4"
          rotation="0 0 0">
        </a-entity>
                
        <a-entity id="teoria"
          troika-text="color: white;
                      align: justify;
                      maxWidth: 2.5;
                      fontSize: 0.1;
                      anchor: center;
                      baseline: middle"
                      position="5 2.2 -4"
                      rotation="0 0 0">                           
        </a-entity>

        <a-entity id="flecha-izq" 
          class="raycastable"
          geometry="primitive: triangle; "
          material="color: #5BEEF7; side: double"
          position="4.4 1.2 -3.85"
          rotation="180 0 90"
          scale="0.1 0.1 0.1">
        </a-entity>

        <a-entity id="flecha-der" 
          class="raycastable"
          geometry="primitive: triangle;"
          material="color: #5BEEF7; side: double"
          position="5.6 1.2 -3.85"
          rotation="180 0 -90"
          scale="0.1 0.1 0.1">
        </a-entity>

        <a-entity id="pagina-indicador"
          troika-text="value: 1 / 5;
                      color: #5BEEF7;
                      fontSize: 0.1;
                      anchorX: center;
                      anchorY: middle"
          position="5 1.2 -4">
        </a-entity>
      
      </a-entity> 


      <a-box class="massage-zone" position="1.425 0.8 -0.54" rotation="20 80 0" scale="0.1 0.1 0.5" material="color: purple; opacity: 0.3"></a-box>
      <a-box class="massage-zone" position="1.425 0.8 -0.38" rotation="20 100 0" scale="0.1 0.1 0.5" material="color: purple; opacity: 0.3"></a-box>
      
      <a-plane id="botonSalir3D" 
        position="-2.2 1.5 0" rotation="0 90 0"
        width="0.5" height="0.2" 
        color="#1a1a1a" 
        class="raycastable"
        enlace-menu>
          <a-text value="Salir" align="center" width="2" color="#5BEEF7"></a-text>
      </a-plane>


    </a-scene>
  </body>
</html>
