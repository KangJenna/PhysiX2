<!DOCTYPE html>
<html>
  <head>
    <title>Room PC Friction </title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="friction.js"></script>
    <script src="https://unpkg.com/aframe-troika-text/dist/aframe-troika-text.min.js"></script>

      
  </head>

  <body>
    <a-scene>
      <a-assets>
        <a-asset-item id="asset-room" src="../../models/room09-optimizado.glb"></a-asset-item> 
      </a-assets>

      <a-entity gltf-model="#asset-room" position="0 -1.5 -2.5" scale="1 1 1"></a-entity>


      <a-sky color="#1C607A"></a-sky> 
      <a-entity light="type: ambient; intensity: 0.7"></a-entity>
      <a-entity light="type: directional; intensity: 1" position="-1 2 1"></a-entity>

      <a-entity > 
        <a-entity camera look-controls wasd-controls="acceleration:5" position="1.8 1.3 -0.2" >

          <a-entity cursor="rayOrigin: mouse"
                          raycaster="objects: .raycastable">
                </a-entity>
  
            <a-entity id="brazo-virtual"
                      raycaster="objects: .massage-zone; showLine: true; far: 5"
                      pc-controls
                      sequence-physics
                      position="0 0.1 -1"
                      >
                <a-sphere radius="0.05" color="red" opacity="0.9"></a-sphere>
            </a-entity>
            <a-entity id="brazo-virtual-2"
                      position="-0.3  0.2 -1">
                      <a-sphere radius="0.05" color="blue" opacity="0.9"></a-sphere>

            </a-entity>

        </a-camera>
      </a-entity>

   

      <a-entity id="infoPanel2">
        <a-plane width="1.5" height="1" color="#1a1a1a" opacity="0.9" rotation="-90 -360 0" position="0 -0.5 -1.4"></a-plane>    
        <a-text value="TECNICA FRICTION" color="#5BEEF7" align="center" position="0 -0.5 -1.8" width="2.5" rotation="-90 -360 0"></a-text>
        <a-text id="instrucciones-guia" 
                value="Realiza 10 repeticiones (mueve las esferas con el scroll del raton)\n
                      PASO 1:Inicia en la zona Lumbar (Color Amarillo)\n
                       PASO 2:Desliza hacia la zona Dorsal (Color Amarillo)\n
                       PASO 3: Desliza hacia la zona Toraxica Posterior (Color Azul)" 
                color="white" 
                align="center" 
                position="0 -0.5 -1.3"
                rotation="-90 -360 0"
                width="1"
                wrap-count="30">
        </a-text>
      </a-entity>

      <a-entity id="infoPanel3" position="0 -0.5 0" rotation="-90 -360 0">
                <a-plane id="main-panel" width="1" height=".2" color="#1a1a1a" opacity="1">
                <a-text id="count-panel" 
                            position="0 0 0.01" 
                            align="center"
                            width="2"
                            value="Iniciando repeticiones...">
                </a-text>
      </a-entity>


        <a-entity id="infoPanel4" teoria-carrusel >
                <a-plane width="1.5" height="1" color="#1a1a1a" opacity="0.5" rotation="0 0 0" position="5 2 -4" scale="2 2 3"></a-plane>    
                
                <a-entity id="titulo"
                            troika-text="value:Teoría Técnica Friction ;
                            color: cyan;
                            align: center;
                            maxWidth: 2.5;
                            fontSize: 0.15;
                            anchor: center;
                            baseline: middle"
                            position="5 2.8 -4"
                            rotation="0 0 0">

                </a-entity>
                
                <a-entity id="teoria"
                            troika-text=
                            "color: white;
                            align: justify;
                            maxWidth: 2.5;
                            fontSize: 0.1;
                            anchor: center;
                            baseline: middle"
                            position="5 2.2 -4"
                            rotation="0 0 0">
                            
                </a-entity>

                <a-entity id="flecha-izq" 
                    class="raycastable"
                    geometry="primitive: triangle; "
                    material="color: #5BEEF7; side: double"
                    position="4.4 1.2 -3.85"
                    rotation="180 0 90"
                    scale="0.1 0.1 0.1">
                </a-entity>


                <a-entity id="flecha-der" 
                    class="raycastable"
                    geometry="primitive: triangle;"
                    material="color: #5BEEF7; side: double"
                    position="5.6 1.2 -3.85"
                    rotation="180 0 -90"
                    scale="0.1 0.1 0.1">
                </a-entity>

                <a-entity id="pagina-indicador"
                    troika-text="value: 1 / 5;
                                color: #5BEEF7;
                                fontSize: 0.1;
                                anchorX: center;
                                anchorY: middle"
                    position="5 1.2 -4">
                </a-entity>
        </a-entity>

            


      <a-box class="massage-zone" data-step="3" position="1.23 0.1 -0.45" rotation="0 0 -50" scale="0.1 0.1 0.4" material="color: blue; opacity: 0.3"></a-box>

      <a-box class="massage-zone" data-step="2" position="1.51 0.1 -0.50" rotation="20 90 0" scale="0.1 0.1 0.4" material="color: orange; opacity: 0.3"></a-box>

      <a-box class="massage-zone" data-step="2-2" position="1.51 0.1 -0.38" rotation="20 90 0" scale="0.1 0.1 0.4" material="color: orange; opacity: 0.3"></a-box>
      

      <a-plane id="botonSalir3D" 
         position="-2.2 1.5 0" rotation="-10 90 0"
         width="0.5" height="0.2" 
         color="#1a1a1a" 
         class="raycastable"
         enlace-menu>
          <a-text value="Salir" align="center" width="2" color="#5BEEF7"></a-text>
      </a-plane>

    </a-scene>
  </body>
</html>
